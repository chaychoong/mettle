[workspace]
members = ["cargo:."]

# Config for 'dist' (mt-073, ADR-0016 Decision 4).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. No `powershell`: the workspace
# ships zero Windows targets (ADR-0016 -- native GA runners only, deferred
# Windows), and a PowerShell installer with nothing to fetch is a no-op
# `dist` itself warns about ("skipping powershell installer: not building
# any supported platforms"). Add it back the day a windows-* target lands.
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). All four
# are native GA GitHub runners (macOS arm64/x86_64, Ubuntu arm64/x86_64) --
# the workspace is zero-C-dep, so no cross toolchain is needed for any of
# them (ADR-0016).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# GitHub Artifact Attestations (the current signing norm; no key custody --
# ADR-0016 Decision 4).
github-attestations = true
# Homebrew tap to publish formulae to. The `chaychoong/homebrew-mettle`
# repo does not exist yet as of this bead (mt-073) -- the coordinator must
# create it (empty is fine, `dist` pushes the formula) and set a
# `HOMEBREW_TAP_TOKEN` repo secret (a PAT with `contents: write` on that
# tap repo; `secrets.GITHUB_TOKEN` can't write cross-repo) before the first
# tagged release. Until then `publish-homebrew-formula` in the generated
# release.yml fails at its checkout step -- the GitHub Release itself
# (built by the `host` job, which does not depend on the Homebrew job)
# still ships with the shell installer and all four archives.
tap = "chaychoong/homebrew-mettle"
# Only the homebrew publish job needs to run post-release; there's no npm
# package or custom job for this workspace.
publish-jobs = ["homebrew"]
