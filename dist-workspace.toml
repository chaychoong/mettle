[workspace]
members = ["cargo:."]

# Config for 'dist' (mt-073, ADR-0016 Decision 4).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. No `powershell`: the workspace
# ships zero Windows targets (ADR-0016 -- native GA runners only, deferred
# Windows), and a PowerShell installer with nothing to fetch is a no-op
# `dist` itself warns about ("skipping powershell installer: not building
# any supported platforms"). Add it back the day a windows-* target lands.
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). All four
# are native GA GitHub runners (macOS arm64/x86_64, Ubuntu arm64/x86_64), so
# each builds on its own hardware and no cross toolchain is needed (ADR-0016).
#
# The workspace is NO LONGER zero-C-dep (ADR-0027 / mt-121): CaDiCaL is the
# default solver and its ~100 vendored C++ sources compile into every artifact
# this config produces, which link libstdc++. Each runner image supplies the C++
# compiler, which is why no `features` key or toolchain step appears here -- but
# it also means a target that cannot build the C++ cannot be released at all.
# `.github/workflows/backend-determinism.yml` is what proves the four of them on
# a tag, and it has NOT yet run on one (mt-124 owns closing that).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# GitHub Artifact Attestations (the current signing norm; no key custody --
# ADR-0016 Decision 4).
github-attestations = true
# Homebrew tap to publish formulae to. The owner's existing shared tap
# (`brew install chaychoong/tap/mettle`). Publishing needs a
# `HOMEBREW_TAP_TOKEN` repo secret (a PAT with `contents: write` on the
# tap repo; `secrets.GITHUB_TOKEN` can't write cross-repo). Without it
# `publish-homebrew-formula` in the generated release.yml fails at its
# checkout step -- the GitHub Release itself (built by the `host` job,
# which does not depend on the Homebrew job) still ships with the shell
# installer and all four archives. The v0.1.0 formula was published to the
# tap by hand (the tag predated this repointing).
tap = "chaychoong/homebrew-tap"
# Only the homebrew publish job needs to run post-release; there's no npm
# package or custom job for this workspace.
publish-jobs = ["homebrew"]
