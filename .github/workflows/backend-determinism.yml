name: backend determinism

# The cross-target determinism battery for the shipped CaDiCaL backend
# (ADR-0019 / mt-089 origin; semantics set by ADR-0027 / mt-124). It answers
# two questions no single machine can:
#
#   1. Can the vendored C++ actually be built on all four release targets?
#      Since ADR-0027 / mt-121 compiled the backend into every build, this is
#      the precondition for shipping, full stop — a target that cannot build
#      the C++ cannot be released.
#   2. Does the backend give the same bytes on every target? Under ADR-0027
#      this is the STANDING CROSS-ARCH DETERMINISM GATE ("byte-compare
#      double-run at wraps; cross-arch at release tags"): determinism-by-pinning
#      must hold across real hardware, and a `cadical`-row difference across
#      targets FAILS this workflow. The gate was first passed for real on
#      2026-08-25 (mt-124): aarch64-darwin, aarch64-linux, x86_64-linux and
#      x86_64-darwin all hashed identically, confirming what the mt-120 Rosetta
#      run could only approximate. `-ffp-contract=off` (see
#      `.cargo/config.toml`) is the one known divergence source, closed there.
#
# History: until mt-124 this workflow carried the own CDCL as a byte-identity
# control and treated CaDiCaL differences as a measurement (ADR-0019 §1).
# ADR-0027 decision 3 deleted that backend; the measured cross-target identity
# above is what justified promoting the measurement to a gate.

on:
  # Tags are the point: a release should exercise the same four targets
  # cargo-dist builds, at the moment it builds them.
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Cheap insurance on the code that could move the answer.
  pull_request:
    paths:
      - "crates/als-solve/**"
      - "crates/mettle/tests/fixtures/determinism/**"
      - "scripts/backend-determinism.sh"
      - ".cargo/config.toml"
      - ".github/workflows/backend-determinism.yml"

jobs:
  hash:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every target reports, even if one cannot build: "which targets can build
      # the C++" is exactly the question, so a single failure must not cancel the
      # rest of the answer.
      fail-fast: false
      matrix:
        include:
          # The four cargo-dist targets (dist-workspace.toml), each on the native
          # runner cargo-dist itself uses — no cross-compilation, so the C++ is
          # built by the same toolchain that will build it at release time.
          # x86_64 macOS runs on `macos-15-intel`: GitHub retired `macos-13`
          # (the old Intel image) in December 2025, and `macos-15-intel` is the
          # label dist 0.32.0's release jobs already use (verified against the
          # v0.1.1 release run). It is also GitHub's LAST Intel macOS image,
          # scheduled to retire in fall 2027 — when it goes, the
          # x86_64-apple-darwin release target goes with it (an ADR at that
          # time owns the call).
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The repo pin, as in ci.yml.
          toolchain: 1.97.0
      - name: report the C++ toolchain
        # Recorded rather than assumed: if a runner image's compiler changes, the
        # hashes may move with it, and this line is how that gets diagnosed
        # instead of argued about.
        run: |
          cc --version || true
          c++ --version || true
      - name: build with the cadical backend
        # No feature flag since ADR-0027 / mt-121: every build carries CaDiCaL,
        # so this step failing IS question (1)'s answer for that target.
        run: cargo build --release -p mettle
      - name: run the battery
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/backend-determinism.sh ./target/release/mettle \
            | tee "hashes-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.target }}
          path: hashes-${{ matrix.target }}.txt

  compare:
    name: compare across targets
    needs: hash
    # `always()`: a target that failed to build is a finding to report, not a
    # reason to skip the comparison of the ones that did.
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
      - name: diff the hash tables
        run: |
          set -u
          ls -1 hashes-*.txt || { echo "no target produced hashes"; exit 1; }
          echo "== per-target reports =="
          for f in hashes-*.txt; do echo "--- $f"; cat "$f"; done

          # Strip the comment header (it names the target on purpose) and compare
          # the solver/model/hash rows.
          for f in hashes-*.txt; do grep -v '^#' "$f" | sort > "rows-$(basename "$f")"; done
          first=$(ls -1 rows-hashes-*.txt | head -1)

          status=0
          echo "== cross-arch determinism gate (ADR-0027: must be identical everywhere) =="
          for f in rows-hashes-*.txt; do
            if diff -u "$first" "$f"; then
              echo "  $f: identical to $first"
            else
              echo "DETERMINISM GATE VIOLATION: $f differs from $first"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "cadical: byte-identical across every target that built"

          # Every target must have produced a report; a missing one means the
          # build failed, which is the answer to question (1) above.
          count=$(ls -1 rows-hashes-*.txt | wc -l)
          echo "targets reporting: $count of 4"
          if [ "$count" -ne 4 ]; then
            echo "NOT ALL TARGETS BUILT the cadical backend — those targets cannot be released"
            status=1
          fi
          exit "$status"
