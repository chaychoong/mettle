name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Match rust-toolchain.toml (the repo pin) so CI doesn't install
          # stable and then have rustup auto-install the pin on first cargo call.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --workspace --all-targets
      # Covers the CaDiCaL backend too: ADR-0027 / mt-121 made it part of every
      # build, so the `--solver cadical` surface, the cross-backend instrument
      # and the enumeration seam under CaDiCaL all run here. The separate
      # `cadical` job this replaced existed only to execute what the feature flag
      # kept out of this one. The runner's C++ toolchain now builds ~100 vendored
      # sources on a cold cache, which is the cost of that.
      - name: cargo test
        run: cargo test --workspace
