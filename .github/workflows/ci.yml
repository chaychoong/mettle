name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Match rust-toolchain.toml (the repo pin) so CI doesn't install
          # stable and then have rustup auto-install the pin on first cargo call.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  # The optional CaDiCaL backend (ADR-0019 / mt-089) is off by default, so the
  # job above compiles its Rust under `clippy --all-features` but never RUNS a
  # single feature-gated test. This job does: it is the only place the
  # `--solver cadical` surface, the cross-backend instrument and the enumeration
  # seam under CaDiCaL are actually executed. Separate from `ci` so the fast
  # feedback loop stays fast — this one also compiles ~100 vendored C++ files.
  cadical:
    name: optional cadical backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: cargo test --all-features
        run: cargo test --workspace --all-features
