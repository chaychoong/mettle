[package]
name = "als-core"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `cadical` (OFF by default, ADR-0019 / mt-089 stage 2): compiles the optional
# CaDiCaL backend into als-solve, which makes `SolveOptions::backend` selectable
# as `Backend::Cadical` on every solve path (verdict, enumeration, temporal).
# The DEFAULT of that field is the own CDCL regardless, so a build with this
# feature on still behaves identically unless a caller asks for the other
# backend -- the feature widens what is *selectable*, never what is default.
cadical = ["als-solve/cadical"]
# `cadical-instrument` (OFF by default, ADR-0019 / mt-089 stage 1): compiles the
# `instrument` module, which hands one translated CNF to either backend and
# cross-checks them. Pure addition -- no shipped path is conditional on it, so a
# default build is the same crate it was.
cadical-instrument = ["cadical"]

[dependencies]
# als-syntax: translation reads the AST produced by the parser.
als-syntax = { path = "../als-syntax" }
# als-types: bounds/IR construction relies on the resolved sig hierarchy and checker output.
als-types = { path = "../als-types" }
# als-solve: Tseitin->CNF output is expressed in als-solve's CNF interface types.
als-solve = { path = "../als-solve" }
# thiserror: typed, render-free per-phase error enum (STYLE E1) -- TranslateError
# is the translation-phase reject boundary, exactly the role thiserror already
# plays for ResolveError in als-types. Version pinned to the workspace.
thiserror = "1"
