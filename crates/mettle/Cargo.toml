[package]
name = "mettle"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
# description/homepage: consumed by the Homebrew formula `dist` generates
# (mt-073) -- without them `dist generate` warns and the formula ships
# without a description/homepage stanza.
description = "A Rust reimplementation of the Alloy 6 language and analyzer"
homepage = "https://github.com/chaychoong/mettle"

[[bin]]
name = "mettle"
path = "src/main.rs"

[lints]
workspace = true

[features]
# `cadical` (OFF by default, ADR-0019 / mt-089 stage 2): compiles the optional
# CaDiCaL backend in, which is what makes `--solver cadical` a selectable name.
# OFF in the shipped artifacts: the four cargo-dist targets, the Dockerfile and
# the nix flake are all built on the "no C/C++ toolchain anywhere" premise
# (ADR-0016), and this feature's dependency compiles ~100 vendored C++ files.
# A build WITHOUT it is byte-for-byte the binary it always was; a build WITH it
# still defaults to the own CDCL, so the feature only widens what `--solver` can
# select. `cargo build --release -p mettle --features cadical` is the opt-in
# (crates.io is deliberately not a channel, per the README) until the release
# matrix has proven the C++ build on all four targets (ADR-0019 addendum,
# `.github/workflows/backend-determinism.yml`).
cadical = ["als-solve/cadical", "als-core/cadical"]

[dependencies]
# als-syntax: the CLI parses source for check/run/eval/serve.
als-syntax = { path = "../als-syntax" }
# als-solve: the CLI selects and drives a Solver backend.
als-solve = { path = "../als-solve" }
# als-types: the CLI resolves/type-checks parsed models.
als-types = { path = "../als-types" }
# als-core: the CLI drives bounds/IR/CNF translation for check/run.
als-core = { path = "../als-core" }
# als-instance: the CLI decodes and evaluates instances for run/eval.
als-instance = { path = "../als-instance" }
# als-sterling: the CLI's `serve` subcommand speaks the Sterling protocol.
als-sterling = { path = "../als-sterling" }

[dev-dependencies]
# tungstenite + serde_json: `tests/serve.rs` drives the built binary the way a
# browser will -- a real WebSocket client over a real socket, decoding the real
# JSON. Anything less would test the session and skip the wire, which is where
# `mettle serve`'s new risk actually lives. Both are already in the dependency
# tree via als-sterling, so this costs nothing.
tungstenite = "0.30"
serde_json = "1"
