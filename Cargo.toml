[workspace]
resolver = "2"
members = [
    "crates/als-syntax",
    "crates/als-solve",
    "crates/als-types",
    "crates/als-core",
    "crates/als-instance",
    "crates/als-sterling",
    "crates/als-conform",
    "crates/mettle",
]
# The vendored CaDiCaL binding (ADR-0027 / mt-121, see vendor/README.md) lives
# under the workspace root, so cargo would otherwise adopt it as a member. It
# must NOT be one: it is upstream code we carry a small patch on top of, and
# a member would inherit `unsafe_code = "forbid"` (an FFI binding is nothing but
# unsafe) along with our fmt and clippy gates on prose and style that are the
# binding author's business, not ours.
exclude = ["vendor/cadical"]

[workspace.package]
edition = "2021"
version = "0.1.2"
license = "MPL-2.0"
repository = "https://github.com/chaychoong/mettle"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Optimize the solve-path crates even in dev/test builds (mt-091): the debug
# `solve_corpus` gauntlet is dominated by unoptimized encode/solve codegen, not
# by the assertions it exists to arm. `opt-level` is independent of
# `debug-assertions`/`overflow-checks`, which stay ON in these profiles — the
# armed-invariant coverage is unchanged (canary: `debug_assertions_are_armed…`
# in als-core's solve_corpus test). Deliberately NOT applied to als-syntax: the
# mt-014 deep-nesting depth guard is calibrated against debug frame sizes.
[profile.dev.package.als-core]
opt-level = 2
[profile.dev.package.als-solve]
opt-level = 2
